<script>'use strict';
/* BEAST Global Owner Panel v4 - front-end DEMO. All data is generated sample data.
   A real system MUST enforce auth, permissions, ledger and audit on a backend. */

const IDLE_MS=5*60*1000, ELEV_MS=2*60*1000, AUTH_KEY='beastOwnerDemoAuthV3';
const OWNER_KEY_HASH='7394758623571d30695d7f74364aa79c4f75c330c5d43210eb5f6b54470595a2';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const E=s=>String(s??'').replace(/[&<>"'`]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));
const enc=new TextEncoder();
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const pad=(n,l)=>String(n).padStart(l,'0');
const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3000)};
const debounce=(fn,ms=200)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};

/* ---------- money: integer minor units ---------- */
const MINOR={KE:100,TZ:100,UG:100,NG:100,ZM:100};
const toMinor=(major,cc)=>Math.round(Number(major)*MINOR[cc]);
const toMajor=(minor,cc)=>Math.round(Number(minor))/MINOR[cc];
const fmtMinor=(minor,cc)=>{const c=CO[cc],d=c.dec;return c.cur+' '+(toMajor(minor,cc)).toLocaleString('en-KE',{minimumFractionDigits:d,maximumFractionDigits:d})};
const kesEq=(minor,cc)=>toMajor(minor,cc)/CO[cc].rate;
const fmtKes=v=>'KES '+Math.round(v).toLocaleString('en-KE');

/* ---------- crypto ---------- */
async function pbkdf2(pass,salt,iter){const k=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:iter},k,256))}
const ctEq=(a,b)=>{if(a.length!==b.length)return false;let d=0;for(let i=0;i<a.length;i++)d|=a[i]^b[i];return d===0};
async function sha(s){return[...new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('')}
const B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function b32enc(bytes){let bits='',out='';for(const b of bytes)bits+=b.toString(2).padStart(8,'0');for(let i=0;i<bits.length;i+=5)out+=B32[parseInt(bits.slice(i,i+5).padEnd(5,'0'),2)];return out}
function b32dec(s){let bits='';for(const c of s)bits+=B32.indexOf(c).toString(2).padStart(5,'0');const o=[];for(let i=0;i+8<=bits.length;i+=8)o.push(parseInt(bits.slice(i,i+8),2));return new Uint8Array(o)}
async function hotp(secret,counter){const key=await crypto.subtle.importKey('raw',b32dec(secret),{name:'HMAC',hash:'SHA-1'},false,['sign']);const buf=new ArrayBuffer(8),dv=new DataView(buf);dv.setUint32(0,Math.floor(counter/2**32));dv.setUint32(4,counter>>>0);const h=new Uint8Array(await crypto.subtle.sign('HMAC',key,buf));const o=h[19]&15;const n=((h[o]&127)<<24)|(h[o+1]<<16)|(h[o+2]<<8)|h[o+3];return String(n%1000000).padStart(6,'0')}
async function verifyTotp(secret,code,lastStep){const step=Math.floor(Date.now()/30000);for(const d of[0,-1,1]){const s=step+d;if(s<=lastStep)continue;if(await hotp(secret,s)===code)return s}return 0}

/* ---------- auth store ---------- */
let AMEM=null;
const getAuth=()=>{try{const v=JSON.parse(localStorage.getItem(AUTH_KEY));if(v)return v}catch(e){}return AMEM};
const saveAuth=a=>{AMEM=a;try{localStorage.setItem(AUTH_KEY,JSON.stringify(a))}catch(e){}};
const keyHash=()=>(getAuth()||{}).keyHash||OWNER_KEY_HASH;
const tot=()=>(getAuth()&&getAuth().bio)?4:3;
const okPass=p=>p.length>=12&&new Set(p).size>=6&&(/[a-z]/.test(p)+/[A-Z]/.test(p)+/\d/.test(p)+/[^A-Za-z0-9]/.test(p)>=3||p.length>=18);

/* ---------- session ---------- */
const S={authed:false,role:'owner',actor:'owner',page:'dashboard',elev:0,last:Date.now(),pass1:false,pending:null,stepFails:0,modalToken:0,currentModalId:null,keyUnlocked:false};
const PERMS={
  owner:'*',
  admin:['users.view','users.restrict','users.pii','tx.view','tx.reconcile','tx.export','country.view','country.edit','biz.view','biz.moderate','ai.view','ai.manage','support.manage','security.view','security.act','audit.view','float.view','float.move','agents.view','agents.manage','payout.view','payout.create','aml.view','aml.act','recon.view','recon.upload',
    'cmd.view','wallet.view','wallet.act','kyc.act','shield.view','shield.act','pay.view','pay.manage','merch.view','merch.manage','cards.view','cards.act','intl.view','intl.act','rev.view','loans.view','notif.view','emp.view','dev.view','comp.view','emerg.view','depts.view','progress.view','wd.view','wd.approve','rvs.view','rvs.act'],
  support:['users.view','tx.view','support.manage','country.view','agents.view','notif.view','cards.view','wallet.view'],
  finance:['tx.view','tx.reconcile','tx.export','biz.view','country.view','audit.view','float.view','float.move','payout.view','payout.create','recon.view','recon.upload',
    'cmd.view','wallet.view','rev.view','intl.view','pay.view','merch.view','loans.view','notif.view','progress.view','wd.view','rvs.view'],
  security:['users.view','users.restrict','tx.view','security.view','security.act','audit.view','country.view','ai.view','aml.view','aml.act',
    'cmd.view','shield.view','shield.act','wallet.view','wallet.act','cards.view','cards.act','notif.view','emerg.view','comp.view','pay.view','dev.view','merch.view','intl.view','rvs.view']
};
const ROLE_LABEL={owner:'Owner',admin:'Administrator',support:'Support agent',finance:'Finance',security:'Security analyst'};
const can=p=>{const r=PERMS[S.role];return r==='*'||r.includes(p)};

/* ---------- audit log ---------- */
let AUD=[];let aq=Promise.resolve();
const audit=(action,target,detail)=>aq=aq.then(async()=>{

  const pw=$('#lp').value;e.textContent='Checking…';const h=await pbkdf2(pw,unb64(A.salt),A.iter);$('#lp').value='';
  if(!ctEq(h,unb64(A.hash))){await bumpFail(A);const w=Math.ceil((A.lockUntil-Date.now())/1000);login1(w>0?'':'Wrong passphrase or code.');return}
  S.pass1=true;login2();
}

async function login2Go(){
  const A=getAuth(),code=$('#tc').value.trim();if(!S.pass1){login1();return}
  if(Date.now()<A.lockUntil){S.pass1=false;login1();return}
  if(!/^\d{6}$/.test(code)){$('#gerr').textContent='Enter the 6-digit code.';return}
  const st=await verifyTotp(A.totp,code,A.lastStep||0);
  if(!st){S.pass1=false;await bumpFail(A);login1('Wrong passphrase or code.');return}
  A.fails=0;A.lockUntil=0;A.lastStep=st;saveAuth(A);S.pass1=false;S.pass2=true;keyScreen();
}

async function verifyKey(){
  if(!S.pass2){gateStart();return}
  const input=$('#serverKey').value.trim(),err=$('#keyErr');
  if(!input){err.textContent='Enter your owner key.';return}
  if(await sha(input)!==keyHash()){S.keyFails=(S.keyFails||0)+1;await audit('owner_key_failed','session','attempt '+S.keyFails);
    if(S.keyFails>=5){S.pass2=false;S.keyFails=0;lock('Too many wrong owner keys. Signed out.');return}
    err.textContent='Invalid owner key.';$('#serverKey').value='';$('#serverKey').focus();return}
  S.keyFails=0;S.pass2=false;err.textContent='';
  if(getAuth().bio){S.pass3=true;bioStep();return}
  startSession('passphrase + authenticator + owner key');
}

  catch(x){S.bioFails=(S.bioFails||0)+1;await audit('biometric_failed','session','attempt '+S.bioFails);if(S.bioFails>=3){S.bioFails=0;S.pass3=false;lock('Fingerprint or face failed 3 times. Signed out.');return}e.textContent='Check failed or cancelled. Attempt '+S.bioFails+' of 3.'}}

PAGES.push({id:'recon',ico:'🧮',label:'Reconciliation',perm:'recon.view',render(){

  <div class="card"><h3>Upload provider statement</h3>
    <div class="field"><label for="rc_cc">Country</label><select id="rc_cc" class="ctl">${Object.entries(CO).map(([k,c])=>`<option value="${k}">${c.f} ${E(c.n)}</option>`).join('')}</select></div>
    <div class="field"><label for="rc_prov">Provider</label><select id="rc_prov" class="ctl">${['M-PESA','Airtel Money','Bank','Card'].map(p=>`<option>${E(p)}</option>`).join('')}</select></div>
    <div class="field"><label for="rc_csv">CSV: provider_ref,amount (per line, max 2000)</label><textarea id="rc_csv" rows="4" placeholder="PRV-ABC123,500.00"></textarea></div>
    <div class="err" id="rcerr" role="alert"></div>
    ${can('recon.upload')?'<button class="btn sm" data-act="rcUpload">Upload &amp; reconcile</button>':'<span class="muted sm">Your role cannot upload.</span>'}
  </div>
  <div class="sec-label">Recent reconciliation runs</div>
  ${tbl(['ID','Country','Provider','Rows','Matched','Unmatched','Status','By','Age'],RECON.map(r=>`<tr><td>${E(r.id)}</td><td>${CO[r.cc].f}</td><td>${E(r.provider)}</td><td>${r.rows}</td><td>${r.matched}</td><td>${r.unmatched}</td><td>${stPill(r.st)}</td><td>${E(r.by)}</td><td>${agoM(r.age)}</td></tr>`))}
  <div class="sec-label">Duplicate-payment check (same user, amount and provider within 48 h)</div>
  ${tbl(['Reference A','Reference B','User','Amount'],dupes().map(d=>`<tr><td class="mono">${E(d[0].ref)}</td><td class="mono">${E(d[1].ref)}</td><td>${E(d[0].u)}</td><td>${E(fmtMinor(d[0].amtMinor,d[0].cc))}</td></tr>`))}`}});
function dupes(){const out=[];const seen={};TX.forEach(t=>{const k=t.u+'|'+t.amtMinor+'|'+t.src;if(seen[k])out.push([seen[k],t]);else seen[k]=t});return out}
function rcUpload(){if(!can('recon.upload'))return denied('recon.upload');const cc=$('#rc_cc').value,prov=$('#rc_prov').value,lines=$('#rc_csv').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),e=$('#rcerr');
  if(!lines.length){e.textContent='Paste at least one line.';return}if(lines.length>2000){e.textContent='Maximum 2000 rows.';return}
  const stmt=new Map();for(const [i,l] of lines.entries()){const [ref,amt]=l.split(',').map(x=>(x||'').trim());if(!ref||!Number.isFinite(Number(amt))){e.textContent='Line '+(i+1)+' is not valid provider_ref,amount.';return}stmt.set(ref,toMinor(Number(amt),cc))}
  stepUp('Uploading reconciliation file',async()=>{
    let matched=0,unmatched=0;
    for(const [ref,amt] of stmt){const t=TX.find(x=>x.prv===ref);if(t&&t.amtMinor===amt&&t.cc===cc){matched++;t.rec='Matched'}else{unmatched++}}
    const id='RCN-'+Date.now().toString(36).toUpperCase();
    RECON.unshift({id,cc,provider:prov,rows:stmt.size,matched,unmatched,st:unmatched?'Pending review':'Closed',by:S.actor,age:0});
    await audit('recon_uploaded',id,`${matched}/${stmt.size} matched (${prov})`);e.textContent='';toast(`Reconciled: ${matched}/${stmt.size} matched`);repaint()})}

function aiBrief(text){
  const t=(text||'').toLowerCase();let k=Object.keys(CO).find(x=>t.includes(CO[x].n.toLowerCase()))||'KE';const c=CO[k];
  const tx=TX.filter(x=>x.cc===k&&x.age<1440),done=tx.filter(x=>x.st==='Completed'),failed=tx.filter(x=>x.st==='Failed'),flag=tx.filter(x=>x.fl.length);
  const users=USERS.filter(u=>u.cc===k),newU=users.filter(u=>u.reg<1).length,wk=users.filter(u=>u.reg<7).length;

  return `<div class="card mt"><h3>${c.f} ${E(c.n)} — today</h3>
   <div class="kv"><span>Transactions processed</span><b>${done.length} of ${tx.length}</b></div><div class="kv"><span>Revenue generated</span><b>${E(fmtMinor(rev,k))}</b></div>
   <div class="kv"><span>Failed payments</span><b>${failed.length}</b></div><div class="kv"><span>Suspicious activities</span><b>${flag.length}</b></div>
   <div class="kv"><span>Customer growth</span><b>+${newU} today · +${wk} this week</b></div><div class="kv"><span>System problems</span><b>${deg.length?deg.length+' provider degraded':'None seen'} · backend not connected</b></div>
   <h3 class="mt">Recommended actions</h3><div class="list">${acts.map(a=>`<div class="item"><div class="grow">${E(a)}</div></div>`).join('')}</div>
   <p class="hint mt">Rule-based briefing from sample data, not a real AI model. The AI only recommends — any sensitive financial action needs authorized human approval.</p></div>`}

async function chgPassGo(){const A=getAuth(),e=$('#merr'),o=$('#cp0').value,n=$('#cp1').value,r=$('#cp2').value;

/* ===== Reversal Agent + demo money flow (mini app simulator on a demo ledger) ===== */
const RV={on:true,limit:5000,fee:10,W:{amina:'Amina',brian:'Brian'},tx:[],led:[],q:[],log:[],n:0};
const kes=m=>'KES '+(m/100).toLocaleString('en-KE',{minimumFractionDigits:2});
function rvPost(tx,rows){rows.forEach(r=>RV.led.unshift({tx,acct:r[0],amt:r[1]}))}
const rvBal=a=>RV.led.filter(e=>e.acct===a).reduce((x,e)=>x+e.amt,0);
const rvOkLedger=()=>RV.led.reduce((x,e)=>x+e.amt,0)===0;
function rvInit(){RV.led=[];RV.tx=[];RV.q=[];RV.log=[];RV.n=0;rvPost('SEED',[['float',-5000000],['user:amina',3000000],['user:brian',2000000]])}rvInit();
function rvSendCore(from,amtMajor){const to=from==='amina'?'brian':'amina',amt=Math.round(Number(amtMajor)*100);
  if(!Number.isFinite(amt)||amt<=0)return'Enter a positive amount.';if(EM.pay||EM.lock)return'Payments are suspended by an emergency control.';
  const fee=RV.fee*100;if(rvBal('user:'+from)<amt+fee)return'Not enough balance.';
  const id='DT-'+pad(++RV.n,4);rvPost(id,[['user:'+from,-(amt+fee)],['user:'+to,amt],['revenue',fee]]);
  RV.tx.unshift({id,from,to,amt,fee,t:Date.now(),st:'Completed',sc:null,rc:null,why:''});return''}
function rvReqCore(id,why){const t=RV.tx.find(x=>x.id===id);if(!t||t.st!=='Completed')return;t.st='Awaiting receiver';t.sc='yes';t.why=why;agLog(id,'Reversal requested by sender ('+why+'). Waiting for the receiver to confirm.')}
function rvRespCore(id,yes){const t=RV.tx.find(x=>x.id===id);if(!t||t.st!=='Awaiting receiver')return;t.rc=yes?'yes':'no';
  if(!yes){t.st='Declined';agLog(id,'Receiver declined. No money moved. Sent to support as a dispute.');return}agentReview(t)}
function agLog(id,m){RV.log.unshift({id,m,ts:new Date().toISOString().slice(11,19)})}
function agentReview(t){
  const checks=[['Sender confirmed',t.sc==='yes'],['Receiver confirmed',t.rc==='yes'],['Not already reversed',t.st!=='Reversed'],['Receiver has enough balance',rvBal('user:'+t.to)>=t.amt],['No emergency control active',!(EM.pay||EM.lock||EM.wd)]];
  const bad=checks.filter(c=>!c[1]).map(c=>c[0]);const small=t.amt<=RV.limit*100;
  const sum=checks.map(c=>(c[1]?'✓ ':'✗ ')+c[0]).join(' · ');
  if(bad.length){t.st='Rejected';agLog(t.id,'REJECTED — failed: '+bad.join(', ')+'. '+sum);audit('agent_rejected',t.id,'[agent] '+bad.join(', '));return}
  if(!RV.on||!small){t.st='Needs approval';RV.q.unshift(t.id);agLog(t.id,(RV.on?'ESCALATED — amount above the agent limit of '+kes(RV.limit*100):'ESCALATED — agent is switched off')+'. A person must approve. '+sum);audit('agent_escalated',t.id,'[agent] '+kes(t.amt));return}
  rvExec(t,'beast-agent')}
function rvExec(t,who){rvPost(t.id+'-R',[['user:'+t.to,-t.amt],['user:'+t.from,t.amt]]);t.st='Reversed';RV.q=RV.q.filter(x=>x!==t.id);
  agLog(t.id,'REVERSED by '+who+': '+kes(t.amt)+' returned to '+RV.W[t.from]+'. The fee of '+kes(t.fee)+' is kept (policy in this demo). Ledger balanced: '+(rvOkLedger()?'yes':'NO'));audit('reversal_done',t.id,'['+who+'] '+kes(t.amt))}

function rvSetting(el){if(!can('rvs.act')){denied('rvs.act');repaint();return}const k=el.dataset.k;let v=k==='on'?el.checked:Number(el.value);if(k==='limit'&&(!Number.isInteger(v)||v<0||v>100000)){toast('Use a whole number from 0 to 100000.');repaint();return}

/* ===== App connection (test): receives money events from the BEAST app ===== */
const BR={ev:[],last:{},ok:0,warn:0,ch:null};
const sv=(x,n)=>String(x==null?'':x).replace(/[\u0000-\u001f]/g,' ').slice(0,n);
function bridgeIn(ev){
  if(!ev||ev.v!==1||typeof ev.id!=='string'||!Number.isSafeInteger(ev.amount)||!Number.isSafeInteger(ev.balanceAfter)||ev.amount<0||BR.ev.some(x=>x.id===ev.id))return false;
  const e={id:sv(ev.id,40),t:sv(ev.t,30),user:sv(ev.user,30),cur:sv(ev.cur,4),type:sv(ev.type,40),sign:ev.sign==='+'?'+':'-',amount:ev.amount,fee:Number.isSafeInteger(ev.fee)&&ev.fee>0?ev.fee:0,source:sv(ev.source,40),recipient:sv(ev.recipient,40),bal:ev.balanceAfter};
  const prev=BR.last[e.user];let flag='Baseline',d=0;
  if(prev!==undefined){d=e.bal-prev;const okd=e.sign==='+'?[0,e.amount]:[0,-e.amount,-(e.amount+e.fee)];flag=okd.includes(d)?'OK':'Check';flag==='OK'?BR.ok++:BR.warn++}
  e.flag=flag;e.delta=d;BR.last[e.user]=e.bal;BR.ev.unshift(e);if(BR.ev.length>200)BR.ev.pop();
  audit('app_event',e.id,e.type+' '+e.sign+e.amount+' '+flag);
  if(S.authed&&S.page==='bridge')repaint();return true}
try{BR.ch=new BroadcastChannel('beast-bridge');BR.ch.onmessage=m=>bridgeIn(m.data)}catch(e){}
const mj=(m,c)=>(m/100).toLocaleString('en-KE',{minimumFractionDigits:2})+' '+c;

async function liveOn(){if(!can('cmd.view'))return denied('cmd.view');const inp=$('#lv_key'),key=inp?inp.value:'';
  if(!key){LK.err='Enter the server owner key.';repaint();return}
  LK.err='Connecting…';repaint();
  try{const r=await liveFetch('/api/owner/session',{method:'POST',body:JSON.stringify({key})});
    if(!r.ok){LK.err=(r.j&&r.j.error)||('Server said '+r.st);audit('live_connect_failed','server',String(r.st));repaint();return}
    LK.token=r.j.token;LK.iat=Date.now();LK.exp=Date.now()+(r.j.expiresIn||900)*1000;LK.err='';await audit('live_connected','server','owner session');
    await livePull();LK.timer=setInterval(livePull,5000);liveWs();repaint()}
  catch(e){LK.err='Could not reach the server ('+(e&&e.name==='AbortError'?'timed out':'network problem or blocked')+').';repaint()}}
function liveOff(){clearInterval(LK.timer);LK.timer=null;LK.token=null;try{LK.ws&&LK.ws.close()}catch(_){}LK.ws=null;audit('live_disconnected','server','manual');repaint()}
async function livePull(){if(!LK.token)return;
  try{if(Date.now()>LK.exp-180000){const r=await liveFetch('/api/owner/refresh',{method:'POST'});if(r.ok){LK.token=r.j.token;LK.exp=Date.now()+(r.j.expiresIn||900)*1000}else if(r.st===401){LK.err='Session ended. Connect again.';liveOff();return}}
    const r=await liveFetch('/api/owner/events?limit=100');
    if(!r.ok){if(r.st===401){LK.err='Session ended. Connect again.';liveOff()}return}
    LK.mode=r.j.mode||'';LK.last=Date.now();let n=0;(r.j.events||[]).slice().reverse().forEach(e=>{if(bridgeIn(e))n++});if(n&&S.page==='bridge')repaint()}catch(_){}}
function liveWs(){try{const w=new WebSocket(LK.url.replace(/^http/,'ws'));LK.ws=w;w.onmessage=m=>{try{if(JSON.parse(m.data).type==='client_event')livePull()}catch(_){}};w.onclose=()=>{if(LK.token&&LK.ws===w)setTimeout(()=>{if(LK.token)liveWs()},10000)}}catch(_){}}
async function liveRotate(current,next){const r=await liveFetch('/api/owner/rotate-key',{method:'POST',body:JSON.stringify({current,new:next})});return{ok:r.ok,err:r.j&&r.j.error}}
function keeperOpen(){if(!can('vault.view'))return denied('vault');const u=new URL(LK.keeper);KW=window.open(u.origin+u.pathname+'#panel='+encodeURIComponent(location.origin),'beastkeeper');if(!KW)toast('The browser blocked the pop-up. Allow it and try again.')}
window.addEventListener('message',e=>{if(!KW||e.source!==KW||e.origin!==new URL(LK.keeper).origin)return;const d=e.data;
  if(!d||d.type!=='beast-new-secrets'||typeof d.passphrase!=='string'||typeof d.ownerKey!=='string'||d.passphrase.length>80||d.ownerKey.length>80)return;
  KEEP.p=d.passphrase;KEEP.k=d.ownerKey;KEEP.t=Date.now();setTimeout(()=>{if(Date.now()-KEEP.t>=120000){KEEP.p=KEEP.k=''}},121000);
  audit('keeper_secrets_received','vault','not stored');toast('New secrets received. Tap Change passphrase or Change owner key.');try{KW.close()}catch(_){}if(S.page==='vault')repaint()});
function secretPrefill(go){setTimeout(()=>{if(go==='chgPassGo'&&KEEP.p){const a=$('#cp1'),b=$('#cp2');if(a&&b){a.value=b.value=KEEP.p;KEEP.p=''}}
